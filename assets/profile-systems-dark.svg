<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="18" fill="url(#grid)"/>
  <circle cx="980" cy="45" r="210" fill="url(#glow)"/>

  <g fill="none" stroke="#475569" stroke-opacity=".58" stroke-width="1.3">
    <path d="M300 65 C380 65, 390 90, 470 90"/>
    <path d="M300 120 C380 120, 390 120, 470 120"/>
    <path d="M300 175 C380 175, 390 150, 470 150"/>
    <path d="M600 90 C690 90, 690 55, 760 55"/>
    <path d="M600 120 H760"/>
    <path d="M600 150 C690 150, 690 185, 760 185"/>
    <path d="M860 55 C945 55, 950 120, 1035 120"/>
    <path d="M860 120 H1035"/>
    <path d="M860 185 C945 185, 950 120, 1035 120"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="170" y="43" width="130" height="44" rx="11" fill="#161b22" stroke="#334155"/>
    <text x="235" y="70" text-anchor="middle" fill="#cbd5e1" font-size="12">MOBILE</text>

    <rect x="170" y="98" width="130" height="44" rx="11" fill="#161b22" stroke="#334155"/>
    <text x="235" y="125" text-anchor="middle" fill="#cbd5e1" font-size="12">AI AGENTS</text>

    <rect x="170" y="153" width="130" height="44" rx="11" fill="#161b22" stroke="#334155"/>
    <text x="235" y="180" text-anchor="middle" fill="#cbd5e1" font-size="12">REALTIME</text>

    <rect x="470" y="60" width="130" height="120" rx="18" fill="#171c28" stroke="url(#accent)" stroke-width="1.6"/>
    <text x="535" y="108" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">ENGINEERING</text>
    <text x="535" y="132" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">SYSTEM</text>
    <circle cx="535" cy="156" r="6" fill="#22d3ee" filter="url(#softGlow)"/>

    <rect x="760" y="33" width="100" height="44" rx="11" fill="#161b22" stroke="#334155"/>
    <text x="810" y="60" text-anchor="middle" fill="#cbd5e1" font-size="12">BUILD</text>

    <rect x="760" y="98" width="100" height="44" rx="11" fill="#161b22" stroke="#334155"/>
    <text x="810" y="125" text-anchor="middle" fill="#cbd5e1" font-size="12">SHIP</text>

    <rect x="760" y="163" width="100" height="44" rx="11" fill="#161b22" stroke="#334155"/>
    <text x="810" y="190" text-anchor="middle" fill="#cbd5e1" font-size="12">LEARN</text>

    <circle cx="1035" cy="120" r="24" fill="#171c28" stroke="url(#accent)" stroke-width="1.8"/>
    <circle cx="1035" cy="120" r="5" fill="#a78bfa" filter="url(#softGlow)"/>
  </g>
</svg>